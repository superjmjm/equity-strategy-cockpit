name: Verify TinyFish NXNY login
on:
  workflow_dispatch:

permissions: {}
concurrency:
  group: verify-equity-tinyfish
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.32.5,<3' 'playwright>=1.55,<2'
      - name: Check TinyFish profile and NXNY login state
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          TINYFISH_PROFILE_ID: ${{ secrets.TINYFISH_PROFILE_ID }}
        run: |
          python - <<'PY'
          import os, re, requests
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright

          key = os.environ.get("TINYFISH_API_KEY", "").strip()
          profile = os.environ.get("TINYFISH_PROFILE_ID", "").strip()
          if not key or not re.fullmatch(r"[A-Za-z0-9_-]+", profile):
              raise SystemExit("configuration=missing_or_invalid")

          endpoint = f"https://agent.tinyfish.ai/v1/profiles/{profile}"
          auth = {"X-API-Key": key}
          r = requests.get(endpoint, headers=auth, timeout=20, allow_redirects=False)
          print(f"profile_http={r.status_code}")
          r.raise_for_status()

          nxny = "https://www.nxny.com/"
          sess = requests.post(
              f"{endpoint}/setup-session",
              headers=auth,
              json={"url": nxny, "timeout_seconds": 90},
              timeout=55,
          )
          sess.raise_for_status()
          session = sess.json()
          try:
              with sync_playwright() as pw:
                  browser = pw.chromium.connect_over_cdp(session["cdp_url"], timeout=25000)
                  context = browser.contexts[0]
                  context.route(
                      "**/*",
                      lambda route: route.abort()
                      if ("/download/" in urlsplit(route.request.url).path.lower() or urlsplit(route.request.url).path.lower().endswith(".pdf"))
                      else route.continue_(),
                  )
                  page = context.pages[0] if context.pages else context.new_page()
                  page.goto(nxny, wait_until="domcontentloaded", timeout=20000)
                  page.locator("#loginstr2").filter(has_text="退出登录").wait_for(timeout=15000)
                  print("nxny_login=confirmed")
          finally:
              requests.post(
                  f"{endpoint}/setup-session/cancel",
                  headers=auth,
                  json={"session_id": session["session_id"]},
                  timeout=20,
              )
          print("result=passed")
          PY
